<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House of Wisdom v0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#eee7d4;color:#28251e;font-family:Georgia,serif}.app{max-width:760px;margin:auto;padding:18px 18px 70px}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #b9ad8e}header h1{font-size:26px}header button{margin-left:auto}.pill{background:#28251e;color:white;border-radius:99px;padding:8px 12px}.obj{padding:14px 0;font-weight:bold}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}.card{background:#faf6e9;border:1px solid #c6b99a;border-radius:12px;padding:13px;margin:8px 0}.card.active{outline:2px solid #6f5d38}.bar{height:8px;background:#d7cdb5;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#6f5d38}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}button{font:inherit;border:0;border-radius:8px;padding:9px 11px;background:#28251e;color:#fff;cursor:pointer}button:disabled{opacity:.35}.scene{height:180px;border-radius:16px;background:linear-gradient(#1c2b3d 0 55%,#bba77d 55%);display:grid;place-items:center;color:#f4e3a5;font-size:42px}.cipher{font-family:monospace;letter-spacing:4px;padding:12px;background:#e8dfc7}.muted{opacity:.6}html[dir=rtl] header button{margin-left:0;margin-right:auto}</style></head><body><div id="app"></div><script>const K='how-standalone-v01',threshold=[0,0,18,50,100,170,260,380,530,720,950];const A=[['faded','translation','Decipher a Faded Line','فك سطر باهت',6000,1,3,1],['passage','translation','Copy a Clear Passage','نسخ مقطع واضح',10000,2,5,2],['folio','translation','Translate the Mathematical Folio','ترجمة الصحيفة الرياضية',15000,4,8,4],['numerals','mathematics','Practice Numerals','التدرّب على الأرقام',8000,2,4,1,'math'],['proof','mathematics','Work a Geometric Proof','حل برهان هندسي',12000,4,7,3,'math'],['patterns','mathematics','Study Patterns in Letters','دراسة الأنماط في الحروف',18000,7,10,5,'math'],['sky','astronomy','Observe the Night Sky','مراقبة السماء ليلاً',15000,4,5,1,'obs'],['star','astronomy','Record a Star Position','تسجيل موضع نجم',25000,8,9,3,'obs']];function lev(x){let n=1;for(let i=2;i<threshold.length;i++){if(x>=threshold[i])n=i;else break}return n}function fresh(){return{knowledge:0,xp:{translation:0,mathematics:0,astronomy:0},active:'faded',progress:0,last:Date.now(),r:[],kindi:{u:false,s:false,step:0,c:false},obs:0,battani:false,lang:'en'}}let s;try{s=JSON.parse(localStorage.getItem(K))||fresh()}catch{s=fresh()}let offline=null;function has(x){return s.r.includes(x)}function avail(a){return lev(s.xp[a[1]])>=a[7]&&(!a[8]||has(a[8]))}function mult(d){let m=1;if(d==='translation'&&has('desk'))m+=.05;if(d==='translation'&&has('pres'))m+=.1;if(d==='mathematics'&&has('follow'))m+=.1;if(s.kindi.c)m+=.1;return m}function tick(now=Date.now()){let e=Math.min(Math.max(0,now-s.last),28800000),a=A.find(x=>x[0]===s.active);if(a&&avail(a)){let total=s.progress+e,n=Math.floor(total/a[4]);s.progress=total%a[4];if(n){let k=Math.floor(n*a[5]*mult(a[1])),x=n*a[6];s.knowledge+=k;s.xp[a[1]]+=x;if(a[1]==='astronomy')s.obs+=n;if(e>15000)offline={k,x}}}if(has('lang'))s.kindi.u=true;if(has('obs')&&lev(s.xp.astronomy)>=5&&s.obs>=18)s.battani=true;s.last=now;localStorage.setItem(K,JSON.stringify(s))}tick();let tab='house';const nodes=[['desk',15,'Restore the Desk','ترميم المكتب'],['math',45,'Numerals in the Margins','أرقام في الهوامش','desk'],['pres',60,'Preserve the Folio','حفظ الصحيفة','math'],['follow',60,'Follow the Pattern','تتبّع النمط','math'],['lang',100,'Patterns in Language','أنماط في اللغة','math'],['script',140,'Restore the Scriptorium','ترميم دار النسخ','kindi'],['heavens',180,'Measured Heavens','السماء المقاسة','script'],['obs',240,'Restore the Observatory','ترميم المرصد','heavens']];function nodeOK(n){if(has(n[0]))return false;if(n[4]==='kindi')return s.kindi.c;if(n[4]&&!has(n[4]))return false;if(n[0]==='lang'&&(lev(s.xp.translation)<4||lev(s.xp.mathematics)<5))return false;if(n[0]==='heavens'&&(lev(s.xp.translation)<6||lev(s.xp.mathematics)<7))return false;return true}function obj(){let ar=s.lang==='ar';if(!has('desk'))return ar?'رمّم المكتب':'Restore the Desk';if(!has('math'))return ar?'افهم الأرقام في الهوامش':'Understand the Numerals in the Margins';if(!s.kindi.c)return ar?'حل شفرة الكندي':'Solve Al-Kindi’s Cipher';if(!has('script'))return ar?'رمّم دار النسخ':'Restore the Scriptorium';if(!has('obs'))return ar?'افتح المرصد':'Reopen the Observatory';return s.battani?(ar?'استعد لسجل البتّاني':'Prepare for Al-Battani’s Chronicle'):(ar?'راقب السماء':'Observe the Sky')}function render(){document.documentElement.dir=s.lang==='ar'?'rtl':'ltr';let ar=s.lang==='ar',a=A.find(x=>x[0]===s.active),pct=a?s.progress/a[4]*100:0;let body=tab==='house'?`<div class=scene>✦ &nbsp; بيت الحكمة &nbsp; ✧</div><h2>${ar?'الفصل الأول: الحارس':'Chapter One: The Keeper'}</h2><p>${ar?'أعد بناء دار المعرفة، اكتشافاً بعد آخر.':'Rebuild the House of Knowledge, one discovery at a time.'}</p>`:tab==='study'?`<div class=bar><i style="width:${pct}%"></i></div><div class=grid>${A.filter(avail).map(x=>`<button class="card ${s.active===x[0]?'active':''}" onclick="s.active='${x[0]}';s.progress=0;tick();render()"><b>${ar?x[3]:x[2]}</b><br><small>${x[4]/1000}s · +${x[5]} ✦ · +${x[6]} XP · Lv ${lev(s.xp[x[1]])}</small></button>`).join('')}</div>`:tab==='research'?nodes.map(n=>`<div class=card><b>${ar?n[3]:n[2]}</b><br><button ${!nodeOK(n)||s.knowledge<n[1]?'disabled':''} onclick="s.knowledge-=${n[1]};s.r.push('${n[0]}');if('${n[0]}'==='lang')s.kindi.u=true;tick();render()">${has(n[0])?'✓':n[1]+' ✦'}</button></div>`).join(''):`<h2>${ar?'السجلات':'Chronicles'}</h2><div class=card><h3>${ar?'الكندي — الشفرة':'Al-Kindi — The Cipher'}</h3>${!s.kindi.u?'<p>Locked</p>':s.kindi.c?'<p>✓ Complete · +10% Knowledge</p>':!s.kindi.s?`<button onclick="s.kindi.s=true;s.kindi.step=1;render()">${ar?'ابدأ السجل':'Begin Chronicle'}</button>`:`<div class=cipher>◇ ○ △ ◇ □ ◇ △ ○ ◇</div><p>${['',ar?'لاحظ التكرار.':'Notice repetition.',ar?'قارن الأنماط باللغة.':'Compare patterns with language.',ar?'اختبر فرضية.':'Test a hypothesis.',ar?'التحليل يكشف المعنى.':'Analysis reveals meaning.'][s.kindi.step]}</p><button onclick="if(s.kindi.step<4)s.kindi.step++;else{s.kindi.c=true;s.kindi.step=5}tick();render()">${ar?'تابع':'Continue'}</button>`}</div><div class="card muted"><h3>${ar?'البتّاني — جداول السماء':'Al-Battani — The Tables of the Sky'}</h3><p>${s.battani?(ar?'تم اكتشاف السجل.':'Chronicle discovered.'):(ar?'لم يُكتشف بعد.':'Not yet discovered.')}</p></div>`;document.getElementById('app').innerHTML=`<div class=app><header><h1>House of Wisdom</h1><button onclick="s.lang=s.lang==='en'?'ar':'en';render()">${ar?'English':'العربية'}</button><span class=pill>✦ ${Math.floor(s.knowledge)}</span></header><div class=obj>${obj()}</div><div class=tabs>${[['house',ar?'الدار':'House'],['study',ar?'الدراسة':'Study'],['research',ar?'البحث':'Research'],['library',ar?'المكتبة':'Library']].map(x=>`<button onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${body}${offline?`<div class=card><b>${ar?'بينما كنت بعيداً':'While you were away'}:</b> +${offline.k} ✦ · +${offline.x} XP <button onclick="offline=null;render()">OK</button></div>`:''}</div>`}setInterval(()=>{tick();render()},500);render();</script></body></html>
